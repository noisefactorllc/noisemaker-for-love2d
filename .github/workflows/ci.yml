name: Native parity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on:
      group: noisemaker-gpu
      labels: [noisemaker-gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install firefox

      - name: Install LÖVE 11.5
        run: |
          archive="$RUNNER_TEMP/love-11.5-macos.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/love2d/love/releases/download/11.5/love-11.5-macos.zip \
            --output "$archive"
          printf '%s  %s\n' \
            '6795bb3a1656af6a2fdfe741e150787b481886d3a280327a261a3fdded586913' \
            "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/love-runtime"
          unzip -q "$archive" -d "$RUNNER_TEMP/love-runtime"
          echo "LOVE_BIN=$RUNNER_TEMP/love-runtime/love.app/Contents/MacOS/love" >> "$GITHUB_ENV"

      - name: Verify native host capabilities
        run: node tools/qualify-capabilities.mjs

      - name: Verify source, compiler, and locked reference
        run: scripts/test

      - name: Verify native GPU regressions
        run: scripts/test-gpu

      - name: Verify full catalog parity
        run: scripts/parity-summary --tier all --out "$RUNNER_TEMP/love-parity"

      - name: Verify extracted package
        run: scripts/package --output "$RUNNER_TEMP/noisemaker-love2d.zip"
